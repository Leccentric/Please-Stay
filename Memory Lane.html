<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory Lane</title>
<style>
:root{--bg:#0b1030;--card:#151b45;--text:#f3f1ff;--muted:#a9b0e0;--red:#ff5d73;--blue:#5d8bff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 20% 10%,#1b2160,transparent 50%),radial-gradient(circle at 80% 90%,#3a1650,transparent 50%),#0b1030;color:var(--text);font-family:Georgia,'Times New Roman',serif;display:flex;justify-content:center}
.wrap{width:100%;max-width:520px;padding:24px 18px;text-align:center}
h1{font-weight:normal;letter-spacing:3px;margin:8px 0 4px}
.sub{color:var(--muted);margin-bottom:28px;font-style:italic}
.track{position:relative;height:60px;margin:10px 14px 28px}
.line{position:absolute;top:30px;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),var(--blue));border-radius:2px;opacity:.5}
.dot{position:absolute;top:23px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--bg);border:2px solid var(--muted)}
.dot.done{background:var(--blue);border-color:var(--blue)}
.walker{position:absolute;top:4px;left:0;font-size:26px;margin-left:-13px;transition:left .8s ease}
.card{background:var(--card);border-radius:16px;padding:22px 20px;min-height:140px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.date{color:var(--red);letter-spacing:2px;font-size:14px;text-transform:uppercase;margin-bottom:10px}
.card img{max-width:100%;max-height:320px;border-radius:12px;margin-bottom:14px}
.words{font-size:19px;line-height:1.6}
button{margin-top:22px;background:linear-gradient(90deg,var(--red),var(--blue));color:white;border:0;border-radius:24px;padding:12px 28px;font-size:16px;font-family:inherit;cursor:pointer}
</style>
</head>

var n = memories.length;
var idx = -1;
var track = document.getElementById("track");
var walker = document.getElementById("walker");
var card = document.getElementById("card");
var dots = [];

for (var i = 0; i < n; i++) {
  var d = document.createElement("div");
  d.className = "dot";
  d.style.left = (i / (n - 1) * 100) + "%";
  track.appendChild(d);
  dots.push(d);
}

function showStart() {
  idx = -1;
  walker.style.left = "0%";
  for (var i = 0; i < n; i++) {
    dots[i].className = "dot";
  }
  card.innerHTML = '<div class="words">Come walk with me through some of the moments I keep.</div><button onclick="next()">Start walking</button>';
}

function next() {
  idx++;
  if (idx >= n) {
    showEnd();
    return;
  }
  walker.style.left = (idx / (n - 1) * 100) + "%";
  for (var i = 0; i <= idx; i++) {
    dots[i].className = "dot done";
  }
  var m = memories[idx];
  var html = '<div class="date">' + m.date + '</div>';
  if (m.photo) {
    html += '<img src="' + m.photo + '" alt="">';
  }
  html += '<div class="words">' + m.text + '</div>';
  var label = idx === n - 1 ? "One more thing" : "Keep walking";
  html += '<button onclick="next()">' + label + '</button>';
  card.innerHTML = html;
}

function showEnd() {
  card.innerHTML = '<div class="words">Every one of these was real, and I\'m grateful for each of them. Thank you for being part of my days.<br><br>Ti amo. 🤍</div><button onclick="showStart()">Walk again</button>';
}

showStart();
</script>
